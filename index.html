<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05060f">
<title>Blaster Kids</title>
<style>
  :root{ --c:#ffd24a; --c2:#ff7a00; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#05060f; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#fff; }
  #bg,#stars,#stars2{ position:fixed; inset:0; pointer-events:none; }
  #bg{ background:radial-gradient(120% 80% at 50% 110%, #101a3a 0%, #070a18 55%, #04050c 100%); }
  #stars,#stars2{ background-repeat:repeat; }
  #stars{ background-image:
      radial-gradient(2px 2px at 20% 30%, #fff8, transparent),radial-gradient(1px 1px at 70% 20%, #fff6, transparent),
      radial-gradient(1.5px 1.5px at 40% 80%, #fff7, transparent),radial-gradient(1px 1px at 85% 65%, #fff6, transparent),
      radial-gradient(2px 2px at 10% 70%, #fff7, transparent),radial-gradient(1px 1px at 55% 45%, #fff5, transparent),
      radial-gradient(1.5px 1.5px at 90% 15%, #fff7, transparent),radial-gradient(1px 1px at 30% 10%, #fff5, transparent);
    animation:twinkle 3.5s ease-in-out infinite alternate; }
  #stars2{ background-image:
      radial-gradient(1px 1px at 15% 55%, #9ef, transparent),radial-gradient(1px 1px at 65% 85%, #f9c, transparent),
      radial-gradient(1.5px 1.5px at 80% 40%, #cf9, transparent),radial-gradient(1px 1px at 45% 25%, #9cf, transparent);
    animation:twinkle 5s ease-in-out infinite alternate-reverse; }
  @keyframes twinkle{ from{opacity:.45} to{opacity:1} }

  #fx{ position:fixed; inset:0; pointer-events:none; z-index:2; will-change:transform; }
  #fx.shake{ animation:shakefx .16s ease-out; }
  @keyframes shakefx{ 0%{transform:translate3d(0,0,0)} 25%{transform:translate3d(-5px,3px,0)} 50%{transform:translate3d(4px,-2px,0)} 75%{transform:translate3d(-2px,1px,0)} 100%{transform:translate3d(0,0,0)} }
  #stage{ position:fixed; inset:0; display:flex; align-items:flex-end; justify-content:center; z-index:3; pointer-events:none; }
  #gun{ position:relative; width:min(62vw,340px); margin-bottom:7vh; transform-origin:50% 90%;
        filter:drop-shadow(0 0 18px var(--c)); transition:filter .2s; }
  #gun svg{ width:100%; height:auto; display:block; }
  #gun.recoil{ animation:recoil .16s ease-out; }
  @keyframes recoil{ 0%{transform:translateY(0) rotate(0)} 35%{transform:translateY(12px) rotate(-2.5deg)} 100%{transform:translateY(0) rotate(0)} }

  #flash{ position:fixed; inset:0; background:var(--c); opacity:0; pointer-events:none; z-index:5; mix-blend-mode:screen; }
  #flash.on{ animation:flash .16s ease-out; }
  @keyframes flash{ 0%{opacity:.6} 100%{opacity:0} }

  #hud{ position:fixed; top:0; left:0; right:0; padding:12px 14px 4px; display:flex; align-items:center; gap:10px; z-index:10; pointer-events:none; }
  #title{ font-weight:900; letter-spacing:1px; font-size:clamp(14px,4vw,20px); text-shadow:0 0 14px var(--c); }
  #combo{ font-weight:900; font-size:clamp(12px,3.4vw,16px); color:#fff; opacity:0; transition:.2s; text-shadow:0 0 12px var(--c); }
  #combo.on{ opacity:1; }
  #score{ margin-left:auto; font-variant-numeric:tabular-nums; font-weight:900; font-size:clamp(16px,5vw,26px); text-shadow:0 0 16px var(--c); }

  #modes{ position:fixed; top:44px; left:0; right:0; display:flex; gap:7px; padding:6px 10px 8px;
          overflow-x:auto; overflow-y:hidden; z-index:10; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  #modes::-webkit-scrollbar{ display:none; }
  .mode{ flex:0 0 auto; border:1px solid #ffffff22; background:#ffffff10; border-radius:999px;
         padding:7px 11px; font-size:clamp(11px,3.2vw,14px); font-weight:800; display:flex; align-items:center; gap:5px;
         transition:.15s; white-space:nowrap; }
  .mode .dot{ width:9px; height:9px; border-radius:50%; background:currentColor; box-shadow:0 0 10px currentColor; }
  .mode.active{ background:#ffffff22; border-color:currentColor; transform:scale(1.06); color:#fff; }
  .mode.active .dot{ background:var(--c); }
  .mode.rand{ border-style:dashed; }

  /* cartão educativo: uma letra/palavra por vez, grande e legível */
  #card{ position:fixed; left:50%; top:32%; transform:translate(-50%,-50%) scale(.6);
         z-index:9; display:flex; flex-direction:column; align-items:center;
         width:96vw; text-align:center; pointer-events:none; opacity:0; }
  #card.show{ animation:cardPop 2.8s ease-out forwards; }
  @keyframes cardPop{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.5)}
    4%{opacity:1; transform:translate(-50%,-50%) scale(1.16)}
    10%{transform:translate(-50%,-50%) scale(.93)}
    16%{transform:translate(-50%,-50%) scale(1.08)}
    22%{transform:translate(-50%,-50%) scale(.97)}
    28%{transform:translate(-50%,-50%) scale(1.03)}
    34%{transform:translate(-50%,-50%) scale(1)}
    86%{opacity:1; transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1.04)}
  }
  #cardCh{ font-weight:900; font-size:clamp(92px, min(34vw,24vh), 240px); line-height:.9;
           text-shadow:0 0 34px var(--c), 0 8px 0 #0007, 0 0 4px #000; }
  #cardWord{ font-weight:900; font-size:clamp(26px, min(10vw,7vh), 64px); line-height:1.1; margin-top:4px;
             text-shadow:0 0 22px var(--c), 0 4px 0 #0008, 0 0 4px #000;
             overflow-wrap:break-word; }

  #hint{ position:fixed; bottom:10px; left:0; right:0; text-align:center; font-size:clamp(10px,3vw,13px); color:#ffffff80; pointer-events:none; z-index:10; }

  /* botões grandes de troca de arma */
  .nav{ position:fixed; top:44%; transform:translateY(-50%);
        width:clamp(66px,18vw,100px); height:clamp(66px,18vw,100px);
        border-radius:50%; z-index:12; padding:0;
        display:flex; align-items:center; justify-content:center;
        font:900 clamp(38px,11vw,58px)/1 system-ui,sans-serif; color:#fff;
        background:#ffffff14; border:2px solid #ffffff30;
        -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
        box-shadow:0 8px 24px #000a, inset 0 0 20px #ffffff12, 0 0 22px -6px var(--c);
        text-shadow:0 0 16px var(--c);
        touch-action:none; user-select:none; -webkit-user-select:none;
        transition:transform .11s ease-out, background .15s; }
  .nav:active{ transform:translateY(-50%) scale(.9); background:#ffffff2e; }
  #prev{ left:clamp(8px,2.5vw,20px); }
  #next{ right:clamp(8px,2.5vw,20px); }
  @media (orientation:landscape){ #gun{ width:min(34vw,300px); margin-bottom:4vh; } .nav{ top:50%; } #card{ top:40%; } }
</style>
</head>
<body>
<div id="bg"></div><div id="stars"></div><div id="stars2"></div>
<canvas id="fx"></canvas>

<div id="hud">
  <div id="title">⚡ BLASTER</div>
  <div id="combo"></div>
  <div id="score">0</div>
</div>
<div id="modes"></div>

<button id="prev" class="nav" aria-label="Arma anterior">‹</button>
<button id="next" class="nav" aria-label="Próxima arma">›</button>

<div id="stage">
  <div id="gun">
    <svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2b3350"/><stop offset="1" stop-color="#11162b"/>
        </linearGradient>
        <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="var(--c2)"/><stop offset="1" stop-color="var(--c)"/>
        </linearGradient>
      </defs>
      <rect x="86" y="6" width="28" height="52" rx="9" fill="url(#body)" stroke="#0008"/>
      <rect x="92" y="0" width="16" height="12" rx="5" fill="url(#acc)"/>
      <rect x="90" y="22" width="20" height="7" rx="3.5" fill="var(--c)" opacity=".95"/>
      <rect x="90" y="34" width="20" height="5" rx="2.5" fill="var(--c)" opacity=".55"/>
      <path d="M62 55 h76 a14 14 0 0 1 14 14 v20 a14 14 0 0 1 -14 14 h-16 l-8 30 h-20 l-8 -30 h-10 a14 14 0 0 1 -14 -14 v-20 a14 14 0 0 1 14 -14 z" fill="url(#body)" stroke="#0008"/>
      <rect x="76" y="66" width="48" height="9" rx="4.5" fill="url(#acc)" opacity=".95"/>
      <circle cx="140" cy="70" r="4" fill="var(--c)"/>
      <path d="M78 100 l-9 34 a8 8 0 0 0 8 9 h16 a8 8 0 0 0 8 -9 l-7 -34 z" fill="#0c1020" stroke="#0008"/>
      <rect x="74" y="112" width="30" height="6" rx="3" fill="var(--c)" opacity=".35"/>
      <path d="M104 100 q14 6 14 20" fill="none" stroke="#0c1020" stroke-width="6" stroke-linecap="round"/>
    </svg>
  </div>
</div>

<div id="card"><div id="cardCh"></div><div id="cardWord"></div></div>

<div id="flash"></div>
<div id="hint">Toque para atirar — ‹ › trocam de arma</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const gun=$('gun'), flash=$('flash'), scoreEl=$('score'), comboEl=$('combo'), modesBar=$('modes');
  const card=$('card'), cardCh=$('cardCh'), cardWord=$('cardWord');
  const cv=$('fx'), cx=cv.getContext('2d');
  let W=0,H=0,DPR=1,MX=0,MY=0,FLOOR=0;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,1.25);
    W=window.innerWidth; H=window.innerHeight;
    cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
    cv.style.width=W+'px'; cv.style.height=H+'px';
    cx.setTransform(DPR,0,0,DPR,0,0);
    const r=gun.getBoundingClientRect();
    MX=r.left+r.width*0.5; MY=r.top+r.height*0.03; FLOOR=r.bottom-10;
  }
  addEventListener('resize',resize); resize();

  /* sprites pré-renderizados (evita createRadialGradient por frame) */
  const SPR={};
  function glowSprite(color){
    const key='g'+color; if(SPR[key]) return SPR[key];
    const s=64, c=document.createElement('canvas'); c.width=c.height=s;
    const g=c.getContext('2d');
    const grd=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    grd.addColorStop(0,'#ffffff'); grd.addColorStop(0.32,color); grd.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=grd; g.fillRect(0,0,s,s);
    return SPR[key]=c;
  }
  function smokeSprite(){
    if(SPR.smoke) return SPR.smoke;
    const s=64, c=document.createElement('canvas'); c.width=c.height=s;
    const g=c.getContext('2d');
    const grd=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    grd.addColorStop(0,'rgba(225,230,240,0.6)');
    grd.addColorStop(0.55,'rgba(160,165,175,0.28)');
    grd.addColorStop(1,'rgba(120,125,135,0)');
    g.fillStyle=grd; g.fillRect(0,0,s,s);
    return SPR.smoke=c;
  }

  /* ================= ÁUDIO ================= */
  let ctx=null, master=null, verb=null, verbGain=null;
  function impulse(sec,decay){
    const rate=ctx.sampleRate, len=Math.floor(rate*sec), b=ctx.createBuffer(2,len,rate);
    for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); }
    return b;
  }
  function audio(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      ctx=new AC();
      const comp=ctx.createDynamicsCompressor();
      comp.threshold.value=-16; comp.knee.value=22; comp.ratio.value=14; comp.attack.value=0.002; comp.release.value=0.25;
      master=ctx.createGain(); master.gain.value=0.9;
      master.connect(comp).connect(ctx.destination);
      verb=ctx.createConvolver(); verb.buffer=impulse(1.8,2.2);
      verbGain=ctx.createGain(); verbGain.gain.value=0.16;
      verb.connect(verbGain).connect(master);
    }
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  function out(node, send=0){
    node.connect(master);
    if(send>0){ const g=ctx.createGain(); g.gain.value=send; node.connect(g).connect(verb); }
  }
  function env(g,t,a,d,peak){
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
  }
  let NOISE=null;
  function noiseBuf(){
    if(NOISE) return NOISE;
    const len=Math.floor(ctx.sampleRate*2), b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    return NOISE=b;
  }
  function nz(sec,type,freq,q,t,peak,dur,send){
    const s=ctx.createBufferSource(); s.buffer=noiseBuf();
    const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(q) f.Q.value=q;
    const g=ctx.createGain(); env(g,t,0.001,dur,peak);
    s.connect(f).connect(g); out(g,send); s.start(t); s.stop(t+dur+0.05);
    return {s,f,g};
  }
  function osc(type,freq,t,peak,dur,slide,send){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(1,slide),t+dur);
    env(g,t,0.003,dur,peak); o.connect(g); out(g,send);
    o.start(t); o.stop(t+dur+0.05); return {o,g};
  }
  function bloops(freqs,t,step,peak,dur,type='square'){
    freqs.forEach((f,i)=>osc(type,f,t+i*step,peak,dur,undefined,0.05));
  }

  /* ================= SONS ================= */
  const SOUND={
    pistol(){ const t=ctx.currentTime;
      nz(0.3,'highpass',1500,0,t,0.75,0.07,0.05); osc('sine',150,t,0.7,0.15,40,0.05);
      nz(0.4,'lowpass',900,0,t,0.35,0.14,0.03); },
    rifle(){ const t=ctx.currentTime;
      nz(0.5,'highpass',1100,0,t,0.95,0.12,0.12); osc('sine',110,t,0.9,0.3,35,0.15);
      nz(0.6,'lowpass',800,0,t,0.5,0.28,0.08); },
    shotgun(){ const t=ctx.currentTime;
      nz(0.6,'highpass',800,0,t,1.0,0.18,0.18); osc('sine',70,t,1.0,0.42,30,0.25);
      nz(0.8,'lowpass',700,0,t,0.65,0.42,0.12); },
    mg(){ const t=ctx.currentTime;
      nz(0.25,'highpass',1800,0,t,0.65,0.05,0.02); osc('sine',170,t,0.6,0.1,40,0.02);
      nz(0.3,'lowpass',1000,0,t,0.3,0.1,0.02); },
    sniper(){ const t=ctx.currentTime;
      nz(0.7,'highpass',1400,0,t,1.0,0.09,0.35); osc('sine',90,t,0.9,0.4,28,0.3);
      nz(0.9,'lowpass',600,0,t,0.55,0.5,0.25); setTimeout(()=>{ if(!ctx)return; const t2=ctx.currentTime; nz(0.5,'highpass',900,0,t2,0.25,0.25,0.2); },90); },
    cannonP(){ const t=ctx.currentTime;
      nz(0.9,'lowpass',500,0,t,1.1,0.5,0.4); osc('sine',60,t,1.1,0.6,25,0.4);
      osc('sine',110,t+0.05,0.6,0.4,30,0.3); nz(1.0,'highpass',700,0,t+0.05,0.6,0.3,0.3); },
    suppressed(){ const t=ctx.currentTime;
      nz(0.2,'lowpass',1200,0,t,0.35,0.06,0.0); osc('sine',200,t,0.25,0.06,90,0.0); },
    musket(){ const t=ctx.currentTime;
      nz(0.9,'lowpass',600,0,t,1.0,0.45,0.35); osc('sine',80,t,0.9,0.45,28,0.3);
      nz(1.2,'highpass',3000,1,t+0.1,0.25,0.6,0.2); },
    laser(){ const t=ctx.currentTime;
      const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
      o.type='sawtooth'; o.frequency.setValueAtTime(1900,t); o.frequency.exponentialRampToValueAtTime(160,t+0.15);
      f.type='lowpass'; f.frequency.setValueAtTime(4500,t); f.frequency.exponentialRampToValueAtTime(500,t+0.15);
      env(g,t,0.004,0.15,0.22); o.connect(f).connect(g); out(g,0.12); o.start(t); o.stop(t+0.2); },
    plasma(){ const t=ctx.currentTime;
      const o=ctx.createOscillator(), g=ctx.createGain(), lfo=ctx.createOscillator(), lg=ctx.createGain();
      o.type='square'; o.frequency.setValueAtTime(280,t); o.frequency.exponentialRampToValueAtTime(950,t+0.25);
      lfo.type='sine'; lfo.frequency.value=38; lg.gain.value=260; lfo.connect(lg).connect(o.frequency);
      env(g,t,0.01,0.28,0.17); o.connect(g); out(g,0.15); o.start(t); lfo.start(t); o.stop(t+0.32); lfo.stop(t+0.32);
      nz(0.3,'bandpass',900,2,t,0.12,0.25,0.1); },
    zap(){ const t=ctx.currentTime;
      for(let i=0;i<6;i++) nz(0.06,'bandpass',1200+Math.random()*4500,8,t+i*0.033,0.18,0.05,0.1);
      osc('sawtooth',90,t,0.15,0.2,60,0.05); },
    warp(){ const t=ctx.currentTime;
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(140,t);
      o.frequency.exponentialRampToValueAtTime(2600,t+0.25); o.frequency.exponentialRampToValueAtTime(180,t+0.55);
      const vib=ctx.createOscillator(), vg=ctx.createGain(); vib.frequency.value=20; vg.gain.value=70; vib.connect(vg).connect(o.frequency);
      env(g,t,0.02,0.55,0.18); o.connect(g); out(g,0.22); o.start(t); vib.start(t); o.stop(t+0.6); vib.stop(t+0.6); },
    laserCannon(){ const t=ctx.currentTime;
      osc('sawtooth',60,t,0.14,0.22,320,0.1);
      nz(0.7,'lowpass',2200,0,t+0.18,0.5,0.45,0.35);
      osc('sine',90,t+0.18,0.45,0.45,28,0.3);
      nz(0.8,'highpass',1200,0,t+0.18,0.3,0.3,0.25); },
    alien(){ const t=ctx.currentTime;
      const o=ctx.createOscillator(), g=ctx.createGain(), lfo=ctx.createOscillator(), lg=ctx.createGain();
      o.type='square'; o.frequency.setValueAtTime(620,t); o.frequency.exponentialRampToValueAtTime(1450,t+0.18); o.frequency.exponentialRampToValueAtTime(280,t+0.34);
      lfo.type='sine'; lfo.frequency.value=30; lg.gain.value=200; lfo.connect(lg).connect(o.frequency);
      env(g,t,0.01,0.32,0.14); o.connect(g); out(g,0.2); o.start(t); lfo.start(t); o.stop(t+0.36); lfo.stop(t+0.36); },
    disco(){ const t=ctx.currentTime;
      bloops([880,1108,1318,1760],t,0.055,0.1,0.09,'square'); osc('sine',220,t,0.12,0.25,880,0.15); },
    bubble(){ const t=ctx.currentTime;
      for(let i=0;i<3;i++){ const f=300+Math.random()*500; osc('sine',f,t+i*0.05,0.14,0.1,f*2.5,0.08); } },
    robot(){ const t=ctx.currentTime;
      bloops([440,660,880,660],t,0.045,0.09,0.06,'square'); osc('sawtooth',110,t,0.06,0.2,55,0.03); },
    photon(){ const t=ctx.currentTime;
      osc('sine',2200,t,0.16,0.12,440,0.25); nz(0.15,'highpass',3000,0,t,0.2,0.08,0.15); },
    arc(){ const t=ctx.currentTime;
      for(let i=0;i<8;i++) nz(0.05,'bandpass',900+Math.random()*5000,10,t+i*0.022,0.14,0.04,0.15); },
    quantum(){ const t=ctx.currentTime;
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='triangle'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(1800,t+0.3);
      const o2=ctx.createOscillator(), g2=ctx.createGain(); o2.type='sine'; o2.frequency.setValueAtTime(1790,t); o2.frequency.exponentialRampToValueAtTime(130,t+0.3);
      env(g,t,0.01,0.3,0.12); env(g2,t,0.01,0.3,0.1);
      o.connect(g); o2.connect(g2); out(g,0.25); out(g2,0.25); o.start(t); o2.start(t); o.stop(t+0.35); o2.stop(t+0.35); },
    retro(){ const t=ctx.currentTime;
      bloops([523,659,784,1046],t,0.05,0.09,0.07,'square'); },
    lightning(){ const t=ctx.currentTime;
      nz(0.5,'highpass',1800,0,t,0.95,0.06,0.25);
      nz(1.3,'lowpass',400,0,t+0.02,0.55,0.9,0.45);
      const o=ctx.createOscillator(),g=ctx.createGain(),lfo=ctx.createOscillator(),lg=ctx.createGain();
      o.type='sawtooth'; o.frequency.value=120; lfo.type='square'; lfo.frequency.value=42; lg.gain.value=70;
      lfo.connect(lg).connect(o.frequency);
      env(g,t,0.01,0.3,0.12); o.connect(g); out(g,0.25); o.start(t); lfo.start(t); o.stop(t+0.36); lfo.stop(t+0.36); },

  /* ================= PARTÍCULAS ================= */
  const P=[]; let lastT=performance.now(), dirty=false;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function muzzlePos(){ return { x:MX, y:MY }; }
  function spawn(o){ if(P.length<200) P.push(o); }
  function ring(x,y,color,maxR,life,width){ spawn({t:'ring',x,y,color,maxR,life,max:life,lw:width||3}); }
  function beam(x,y,color,angle,len,life){ spawn({t:'beam',x,y,color,angle,len,life,max:life}); }
  function textPop(x,y,txt,color,size){ spawn({t:'text',x,y,txt,color,size:size||28,life:0.9,max:0.9,vy:-70}); }

  function draw(){
    const now=performance.now();
    const dt=Math.min(50,now-lastT)/1000; lastT=now;
    if(P.length===0){
      if(dirty){ cx.clearRect(0,0,W,H); dirty=false; }
      requestAnimationFrame(draw); return;
    }
    dirty=true;
    cx.clearRect(0,0,W,H);
    for(let i=P.length-1;i>=0;i--){
      const p=P[i]; p.life-=dt;
      if(p.life<=0){ P[i]=P[P.length-1]; P.pop(); continue; }
      const a=Math.max(0,p.life/p.max);
      if(p.t==='spark'||p.t==='ember'){
        p.vy+=(p.g||600)*dt; p.vx*=Math.pow(p.drag||0.92,dt*60); p.vy*=Math.pow(p.drag||0.92,dt*60);
        p.x+=p.vx*dt; p.y+=p.vy*dt;
        cx.globalCompositeOperation='lighter'; cx.globalAlpha=a;
        cx.fillStyle=p.color;
        cx.beginPath(); cx.arc(p.x,p.y,p.r*a+0.5,0,7); cx.fill();
        cx.globalAlpha=1; cx.globalCompositeOperation='source-over';
      } else if(p.t==='smoke'){
        p.x+=(p.vx||0)*dt; p.y+=(p.vy||-18)*dt;
        const r=p.r*(1+(1-a)*2.6);
        cx.globalAlpha=0.5*a;
        cx.drawImage(smokeSprite(),p.x-r,p.y-r,r*2,r*2);
        cx.globalAlpha=1;
      } else if(p.t==='ring'){
        const r=p.maxR*(1-a);
        cx.globalCompositeOperation='lighter'; cx.globalAlpha=a*0.9;
        cx.strokeStyle=p.color; cx.lineWidth=p.lw*a+0.5; cx.beginPath(); cx.arc(p.x,p.y,r,0,7); cx.stroke();
        cx.globalAlpha=1; cx.globalCompositeOperation='source-over';
      } else if(p.t==='beam'){
        cx.globalCompositeOperation='lighter'; cx.globalAlpha=a;
        cx.strokeStyle=p.color; cx.lineWidth=4*a+1;
        cx.beginPath(); cx.moveTo(p.x,p.y);
        cx.lineTo(p.x+Math.sin(p.angle)*p.len, p.y-Math.cos(p.angle)*p.len); cx.stroke();
        cx.globalAlpha=1; cx.globalCompositeOperation='source-over';
      } else if(p.t==='plasma'){
        p.x+=p.vx*dt; p.y+=p.vy*dt;
        const r=p.r*(0.6+a*0.8);
        cx.globalCompositeOperation='lighter'; cx.globalAlpha=a;
        cx.drawImage(glowSprite(p.color),p.x-r,p.y-r,r*2,r*2);
        cx.globalAlpha=1; cx.globalCompositeOperation='source-over';
      } else if(p.t==='star'){
        p.x+=p.vx*dt; p.y+=p.vy*dt;
        cx.globalCompositeOperation='lighter'; cx.globalAlpha=a; cx.fillStyle=p.color;
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot+(1-a)*4);
        const R=p.r, r=R*0.38;
        cx.beginPath();
        for(let k=0;k<8;k++){ const ang=k*Math.PI/4, rad=k%2?r:R; cx.lineTo(Math.cos(ang)*rad,Math.sin(ang)*rad); }
        cx.closePath(); cx.fill(); cx.restore();
        cx.globalAlpha=1; cx.globalCompositeOperation='source-over';
      } else if(p.t==='confetti'){
        p.vy+=500*dt; p.vx*=0.99; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.spin*dt;
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.globalAlpha=a;
        cx.fillStyle=p.color; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore(); cx.globalAlpha=1;
      } else if(p.t==='shell'){
        p.vy+=900*dt; p.vx*=0.995; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.spin*dt;
        if(p.y>FLOOR){ p.y=FLOOR; p.vy*=-0.45; p.vx*=0.7; p.spin*=0.6; }
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.globalAlpha=a;
        cx.fillStyle='#e2b24a'; cx.fillRect(-2,-6,4,12); cx.restore(); cx.globalAlpha=1;
      } else if(p.t==='text'){
        p.y+=p.vy*dt;
        cx.globalAlpha=a; cx.textAlign='center'; cx.font='900 '+p.size+'px system-ui,sans-serif';
        cx.lineWidth=4; cx.strokeStyle='rgba(0,0,0,.6)'; cx.strokeText(p.txt,p.x,p.y);
        cx.fillStyle=p.color; cx.fillText(p.txt,p.x,p.y);
        cx.globalAlpha=1;
      } else if(p.t==='glow'){
        const r=p.r*(1+(1-a)*1.5);
        cx.globalCompositeOperation='lighter'; cx.globalAlpha=a;
        cx.drawImage(glowSprite(p.color),p.x-r,p.y-r,r*2,r*2);
        cx.globalAlpha=1; cx.globalCompositeOperation='source-over';
      } else if(p.t==='bolt'){
        cx.globalCompositeOperation='lighter'; cx.globalAlpha=a;
        cx.strokeStyle=p.color; cx.lineWidth=3*a+1; cx.lineJoin='round';
        cx.beginPath(); p.pts.forEach((q,i)=> i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1])); cx.stroke();
        cx.globalAlpha=1; cx.globalCompositeOperation='source-over';
      } else if(p.t==='shard'){
        p.vy+=700*dt; p.vx*=0.99; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.spin*dt;
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.globalAlpha=a; cx.fillStyle=p.color;
        cx.beginPath(); cx.moveTo(0,-p.r); cx.lineTo(p.r*0.6,p.r*0.6); cx.lineTo(-p.r*0.6,p.r*0.6); cx.closePath(); cx.fill();
        cx.restore(); cx.globalAlpha=1;
      } else if(p.t==='drop'){
        p.vy+=900*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
        cx.globalCompositeOperation='lighter'; cx.globalAlpha=a*0.9; cx.fillStyle=p.color;
        cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill();
        cx.globalAlpha=a*0.3; cx.beginPath(); cx.arc(p.x-p.vx*0.02,p.y-p.vy*0.02,p.r*1.9,0,7); cx.fill();
        cx.globalAlpha=1; cx.globalCompositeOperation='source-over';
      } else if(p.t==='flame'){
        p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy-=220*dt; p.vx*=0.97;
        const r=p.r*(0.5+(1-a)*1.2);
        cx.globalCompositeOperation='lighter'; cx.globalAlpha=a;
        cx.drawImage(glowSprite(p.color),p.x-r,p.y-r,r*2,r*2);
        cx.globalAlpha=1; cx.globalCompositeOperation='source-over';
      } else if(p.t==='frost'){
        p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.spin*dt;
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.globalAlpha=a; cx.strokeStyle=p.color; cx.lineWidth=1.6;
        for(let k=0;k<3;k++){ const ang=k*Math.PI/3;
          cx.beginPath(); cx.moveTo(-Math.cos(ang)*p.r,-Math.sin(ang)*p.r); cx.lineTo(Math.cos(ang)*p.r,Math.sin(ang)*p.r); cx.stroke(); }
        cx.restore(); cx.globalAlpha=1;
      } else if(p.t==='letter'){
        p.y+=p.vy*dt; p.x+=p.vx*dt; p.rot+=p.spin*dt;
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.globalAlpha=Math.min(1,a*1.7);
        cx.textAlign='center'; cx.textBaseline='middle';
        cx.font='900 '+p.size+'px system-ui,sans-serif';
        cx.lineWidth=p.size*0.16; cx.strokeStyle='rgba(0,0,0,.65)'; cx.strokeText(p.txt,0,0);
        cx.fillStyle=p.color; cx.fillText(p.txt,0,0);
        cx.font='800 '+(p.size*0.32)+'px system-ui,sans-serif';
        cx.lineWidth=p.size*0.07; cx.strokeStyle='rgba(0,0,0,.55)'; cx.strokeText(p.sub,0,p.size*0.66);
        cx.fillStyle='#ffffff'; cx.fillText(p.sub,0,p.size*0.66);
        cx.restore(); cx.globalAlpha=1;
      }
    }
    requestAnimationFrame(draw);
  }

  /* ===== FIM VOZ ===== */
  const VAB={}, VBUSY={}; let vSrc=null, vPending=null;
  function stopVoice(){ if(vSrc){ try{ vSrc.stop(); }catch(e){} vSrc=null; } }
  function playBuf(k){
    const b=VAB[k]; if(!b || !ctx) return false;
    stopVoice();
    const s=ctx.createBufferSource(), g=ctx.createGain();
    s.buffer=b; g.gain.value=0.8; s.connect(g).connect(ctx.destination);
    s.onended=()=>{ if(vSrc===s) vSrc=null; };
    s.start(); vSrc=s;
    return true;
  }
  /* decodifica só o clipe que vai tocar (rápido e leve) */
  function sayClip(k){
    if(!ctx) return false;
    if(VAB[k]) return playBuf(k);
    const b64=VOICE[k]; if(!b64) return false;
    if(!VBUSY[k]){
      VBUSY[k]=true;
      const bin=atob(b64), u=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
      ctx.decodeAudioData(u.buffer,
        buf=>{ VAB[k]=buf; VBUSY[k]=false; if(vPending===k){ vPending=null; playBuf(k); } },
        ()=>{ VBUSY[k]=false; });
    }
    vPending=k;
    return true;
  }

  function speak(txt){
    try{
      if(!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(txt);
      u.lang='pt-BR'; u.rate=0.95; u.pitch=1.15; u.volume=1;
      speechSynthesis.speak(u);
    }catch(e){}
  }
  function chime(){
    const c=audio(); if(!c) return; const t=c.currentTime;
    [523,659,784,1046].forEach((f,i)=>osc('sine',f,t+i*0.055,0.09,0.16,undefined,0.2));
  }
  function eduFX(kind){
    const {x,y}=muzzlePos();
    let ch, word;
    if(kind==='alphabet'){ const a=ALPHABET[alphaIdx % ALPHABET.length]; alphaIdx++; ch=a[0]; word=a[1]; }
    else { const n=NUMBERS[numIdx % NUMBERS.length]; numIdx++; ch=n[0]; word=n[1]; }
    const color=EDU_COLORS[Math.floor(Math.random()*EDU_COLORS.length)];
    /* cartão único: letra/número grande + palavra inteira embaixo */
    card.style.setProperty('--c', color);
    cardCh.textContent = ch;
    cardWord.textContent = word;
    card.classList.remove('show'); void card.offsetWidth;
    card.classList.add('show');
    clearTimeout(cardT); cardT=setTimeout(()=>card.classList.remove('show'),2900);
    /* fagulhas de festa no cano, sem atrapalhar a leitura */
    spawn({t:'glow',x,y,r:110,life:0.25,max:0.25,color});
    ring(x,y,color,180,0.5,3);
    for(let i=0;i<22;i++){
      const ang=rnd(-Math.PI*0.95,-Math.PI*0.05), sp=rnd(80,400);
      spawn({t:'confetti',x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,w:rnd(3,7),h:rnd(5,11),rot:rnd(0,6),spin:rnd(-12,12),life:rnd(0.7,1.6),max:1.6,color:EDU_COLORS[Math.floor(Math.random()*EDU_COLORS.length)]});
    }
    for(let i=0;i<12;i++){
      const ang=rnd(-Math.PI*0.95,-Math.PI*0.05), sp=rnd(100,460);
      spawn({t:'star',x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:rnd(4,10),rot:rnd(0,6),life:rnd(0.3,0.8),max:0.8,color:'#fff'});
    }
    shake();
    chime();
    if(!sayClip(ch)) speak(kind==='alphabet' ? ch+' de '+word : word);
  }

  const activePtr=new Set();
  document.addEventListener('pointerdown',e=>{ activePtr.add(e.pointerId); },{passive:true,capture:true});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>
    document.addEventListener(ev,e=>{ activePtr.delete(e.pointerId); },{passive:true,capture:true}));
  function isPalm(e){
    return (e.width>60 && e.height>60) || (e.width>110) || (e.height>110);
  }
  function isGrab(e){ return isPalm(e) || activePtr.size>=4; }

  MODES.forEach((m,i)=>{
    const b=document.createElement('button');
    b.className='mode'+(m.g==='random'?' rand':'');
    b.style.color=m.c;
    b.innerHTML='<span class="dot"></span>'+m.n;
    b.addEventListener('pointerdown',e=>{ e.stopPropagation(); if(!isGrab(e)) setMode(i); });
    modesBar.appendChild(b);
  });
  const chips=[...modesBar.children];
  let modeIndex=0, score=0, combo=0, lastShotAt=0, holding=false, shotTimer=0;

  function setMode(i){
    modeIndex=i;
    stopVoice();
    const m=MODES[i];
    document.documentElement.style.setProperty('--c', m.c);
    document.documentElement.style.setProperty('--c2', m.c2);
    chips.forEach((b,k)=>b.classList.toggle('active',k===i));
    chips[i].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
    if(SOUND.click) SOUND.click(); else if(ctx){ const t=ctx.currentTime; osc('sine',900,t,0.06,0.05,1300,0.05); }
  }

  /* botões grandes de troca de arma */
  function stepMode(d){
    const n=MODES.length;
    setMode((modeIndex+d+n)%n);
    const m=MODES[modeIndex];
    textPop(W/2, H*0.40, m.n, m.c, 42);
    if(navigator.vibrate) navigator.vibrate(14);

  /* troca de arma: só conta como toque se for 1 dedo, rápido e quase parado */
  let navG=null, navLast=0;
  const NAVS={'prev':-1,'next':1};
  Object.keys(NAVS).forEach(id=>{
    const b=$(id), d=NAVS[id];
    b.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation();
      navG = isGrab(e) ? null : {id:e.pointerId, x:e.clientX, y:e.clientY, t:performance.now(), d};
    });
    b.addEventListener('contextmenu',e=>e.preventDefault());
    b.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); });
  });
  window.addEventListener('pointerup',e=>{
    if(!navG || e.pointerId!==navG.id) return;
    const g=navG; navG=null;

    const dist=Math.hypot(e.clientX-g.x, e.clientY-g.y);
    if(dt>900 || dist>24) return;          /* mão apoiada/arrastando: ignora */
    if(isGrab(e)) return;
    if(performance.now()-navLast<140) return;
    navLast=performance.now();
    stepMode(g.d);
  },{passive:true});
  window.addEventListener('pointercancel',()=>{ navG=null; },{passive:true});

  function fire(){
    const c=audio(); if(!c) return;
    let m=MODES[modeIndex];
    if(m.g==='random'){
      const pool=MODES.filter(x=>x.g!=='random' && x.g!=='edu');
      m=pool[Math.floor(Math.random()*pool.length)];
    }
    if(m.g==='edu'){ eduFX(m.s); }
    else {
      SOUND[m.s]();
      if(m.g==='powder') powderFX(m.c,m.w);
      else if(m.g==='laser') laserFX(m.c,m.w);
      else if(m.g==='element') ELEMENT_FX[m.s](m.c,m.w);
      else specialFX(m.s,m.c,m.w);
    }
    if(navigator.vibrate) navigator.vibrate(m.g==='powder'?45:22);
    score++; scoreEl.textContent=score;
    const now=performance.now();
    combo = (now-lastShotAt<850)?combo+1:1;
    lastShotAt=now;
    if(combo>=2){ comboEl.textContent='COMBO x'+combo; comboEl.classList.add('on'); }
    if(combo>0 && combo%10===0){ const {x,y}=muzzlePos(); textPop(x,y-80,'COMBO x'+combo,'#fff',46); }
  }

  let stopHold=null;
  function endHold(){ holding=false; if(shotTimer){ clearInterval(shotTimer); shotTimer=0; } }
  function down(e){
    if(e.target.closest('.mode') || e.target.closest('.nav')) return;
    if(e.pointerType==='mouse' && e.button!==0) return;
    if(isGrab(e)){ endHold(); return; }     /* mão apoiada / 2+ dedos: não atira */
    e.preventDefault();
    endHold();
    holding=true; fire();
    if(MODES[modeIndex].g!=='edu'){
      const t0=performance.now();
      /* teto de 2,2s: se o navegador "perder" o pointerup, não dispara pra sempre */
      shotTimer=setInterval(()=>{
        if(!holding || performance.now()-t0>2200){ endHold(); return; }
        fire();
      }, 115);
    }
    if(!stopHold){
      stopHold=()=>{ endHold(); };
      ['pointerup','pointercancel','touchend','touchcancel','mouseup'].forEach(ev=>
        window.addEventListener(ev,stopHold,{passive:true}));
    }
  }
  document.addEventListener('pointerdown',down,{passive:false});
  /* segurança: nunca continuar atirando se a aba sai de foco */
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) endHold(); });
  addEventListener('blur',endHold);
  document.addEventListener('contextmenu',e=>e.preventDefault());
  let lastTouch=0;
  document.addEventListener('touchend',e=>{ const n=Date.now(); if(n-lastTouch<=300) e.preventDefault(); lastTouch=n; },{passive:false});

  // combo fades
  setInterval(()=>{ if(performance.now()-lastShotAt>1200){ combo=0; comboEl.classList.remove('on'); } },300);

  /* abrir direto num modo: ?m=alfabeto */
  (function(){
    const q=new URLSearchParams(location.search).get('m');
    if(!q) return;
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const i=MODES.findIndex(x=>norm(x.n)===norm(q));
    if(i>=0) modeIndex=i;
  })();
  setMode(modeIndex);
})();
</script>
</body>
</html>
